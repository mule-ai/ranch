[workspace]
resolver = "2"
members = [
    "crates/ranch-protocol",
    "crates/ranch-vt",
    "crates/ranch",
]

[profile.release]
opt-level = 2

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
